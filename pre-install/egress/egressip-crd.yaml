apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: egressips.k8s.ovn.org
spec:
  group: k8s.ovn.org
  scope: Cluster
  names:
    plural: egressips
    singular: egressip
    kind: EgressIP
    listKind: EgressIPList
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - egressIPs
            - namespaceSelector
            properties:
              egressIPs:
                type: array
                minItems: 1
                items:
                  type: string
              namespaceSelector:
                type: object
                properties:
                  matchLabels:
                    type: object
                    additionalProperties:
                      type: string
                  matchExpressions:
                    type: array
                    items:
                      type: object
                      required:
                      - key
                      - operator
                      properties:
                        key:
                          type: string
                        operator:
                          type: string
                          enum:
                          - In
                          - NotIn
                          - Exists
                          - DoesNotExist
                        values:
                          type: array
                          items:
                            type: string
              podSelector:
                type: object
                properties:
                  matchLabels:
                    type: object
                    additionalProperties:
                      type: string
                  matchExpressions:
                    type: array
                    items:
                      type: object
                      required:
                      - key
                      - operator
                      properties:
                        key:
                          type: string
                        operator:
                          type: string
                          enum:
                          - In
                          - NotIn
                          - Exists
                          - DoesNotExist
                        values:
                          type: array
                          items:
                            type: string
          status:
            type: object
            properties:
              items:
                type: array
                items:
                  type: object
                  properties:
                    egressIP:
                      type: string
                    node:
                      type: string
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: EgressIPs
      type: string
      jsonPath: .spec.egressIPs
    - name: Assigned
      type: string
      jsonPath: .status.items[*].node
