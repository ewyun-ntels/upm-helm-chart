---
# Headless Service for StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: nfs-server
  namespace: default
  labels:
    app: nfs-server
spec:
  clusterIP: None
  selector:
    app: nfs-server
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
      protocol: TCP
---
# ClusterIP Service for client access (fixed IP)
apiVersion: v1
kind: Service
metadata:
  name: nfs-server-client
  namespace: default
  labels:
    app: nfs-server
spec:
  type: ClusterIP
  selector:
    app: nfs-server
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nfs-server
  namespace: default
spec:
  serviceName: nfs-server
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      labels:
        app: nfs-server
    spec:
      terminationGracePeriodSeconds: 30
      # Node affinity disabled by default
      # Uncomment and modify to pin NFS to a specific node:
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: kubernetes.io/hostname
      #               operator: In
      #               values:
      #                 - YOUR_NODE_NAME
      initContainers:
        - name: init-exports
          image: alpine:3.22
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /exports
              chmod 777 /exports
              echo "Exports directory initialized"
          volumeMounts:
            - name: nfs-data
              mountPath: /exports
      containers:
        - name: nfs-server
          image: "itsthenetwork/nfs-server-alpine:12"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          env:
            - name: SHARED_DIRECTORY
              value: /exports
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
          volumeMounts:
            - name: nfs-data
              mountPath: /exports
          readinessProbe:
            tcpSocket:
              port: 2049
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 2049
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: nfs-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 3Gi
