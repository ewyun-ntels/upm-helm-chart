apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tcp-bridge-alerts
  namespace: upm-app
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: tcp-bridge
spec:
  groups:
    - name: tcp-bridge.connectivity
      rules:
        - alert: TcpBridgeMetricsUnavailable
          expr: absent(tcp_bridge_connection_state)
          for: 1m
          labels:
            severity: critical
            environment: MetricAlert
            service: tcp-bridge
            instance: tcp-bridge:metrics
          annotations:
            errCode: "2001"
            summary: tcp-bridge metrics 수집 불가
            description: 최근 1분 동안 Prometheus에서 `tcp_bridge_connection_state` 메트릭이 전혀 수집되지 않음. `absent()` 기반 알림이라 connection/pod 라벨은 제공할 수 없으며, tcp-bridge 전체 scrape 이상으로 해석해야 함. Pod 상태, ServiceMonitor, service port, scrape label 설정 확인 필요.

        - alert: TcpBridgeConnectionNotReady
          expr: tcp_bridge:ready_connection_state:max < 2
          for: 1m
          labels:
            severity: critical
            environment: MetricAlert
            service: "{{ $labels.sys_id }}"
            instance: "{{ $labels.sys_id }}:{{ $labels.connection_id }}"
          annotations:
            errCode: "2002"
            summary: connection READY 상태 아님
            description: 지난 2분 동안 `{{ $labels.sys_id }}`의 `{{ $labels.connection_id }}` connection이 READY 상태가 아님. bridge 연결 상태와 failover 동작 확인 필요.

    - name: tcp-bridge.inbound
      rules:
        - alert: TcpBridgeInboundError
          expr: tcp_bridge:inbound_error_count:2m >= 5
          for: 1m
          labels:
            severity: critical
            environment: MetricAlert
            service: "{{ $labels.sys_id }}"
            instance: "{{ $labels.sys_id }}"
          annotations:
            errCode: "3003"
            summary: inbound 에러 심각
            description: 최근 2분 동안 `{{ $labels.sys_id }}`에서 inbound error/timeout/dropped 합계가 5건 이상 발생.

        - alert: TcpBridgeInboundError
          expr: tcp_bridge:inbound_error_count:2m >= 3 and tcp_bridge:inbound_error_count:2m < 5
          for: 1m
          labels:
            severity: major
            environment: MetricAlert
            service: "{{ $labels.sys_id }}"
            instance: "{{ $labels.sys_id }}"
          annotations:
            errCode: "3002"
            summary: inbound 에러 증가
            description: 최근 2분 동안 `{{ $labels.sys_id }}`에서 inbound error/timeout/dropped 합계가 3건 이상 발생.

        - alert: TcpBridgeInboundError
          expr: tcp_bridge:inbound_error_count:2m >= 1 and tcp_bridge:inbound_error_count:2m < 3
          for: 1m
          labels:
            severity: minor
            environment: MetricAlert
            service: "{{ $labels.sys_id }}"
            instance: "{{ $labels.sys_id }}"
          annotations:
            errCode: "3001"
            summary: inbound 에러 발생
            description: 최근 2분 동안 `{{ $labels.sys_id }}`에서 inbound error/timeout/dropped 합계가 1건 이상 발생.

    - name: tcp-bridge.outbound
      rules:
        - alert: TcpBridgeOutboundError
          expr: tcp_bridge:outbound_error_count:2m >= 5
          for: 1m
          labels:
            severity: critical
            environment: MetricAlert
            service: "{{ $labels.sys_id }}"
            instance: "{{ $labels.sys_id }}"
          annotations:
            errCode: "4003"
            summary: outbound 에러 심각
            description: 최근 2분 동안 `{{ $labels.sys_id }}`에서 outbound error/timeout/dropped 합계가 5건 이상 발생.

        - alert: TcpBridgeOutboundError
          expr: tcp_bridge:outbound_error_count:2m >= 3 and tcp_bridge:outbound_error_count:2m < 5
          for: 1m
          labels:
            severity: major
            environment: MetricAlert
            service: "{{ $labels.sys_id }}"
            instance: "{{ $labels.sys_id }}"
          annotations:
            errCode: "4002"
            summary: outbound 에러 증가
            description: 최근 2분 동안 `{{ $labels.sys_id }}`에서 outbound error/timeout/dropped 합계가 3건 이상 발생.

        - alert: TcpBridgeOutboundError
          expr: tcp_bridge:outbound_error_count:2m >= 1 and tcp_bridge:outbound_error_count:2m < 3
          for: 1m
          labels:
            severity: minor
            environment: MetricAlert
            service: "{{ $labels.sys_id }}"
            instance: "{{ $labels.sys_id }}"
          annotations:
            errCode: "4001"
            summary: outbound 에러 발생
            description: 최근 2분 동안 `{{ $labels.sys_id }}`에서 outbound error/timeout/dropped 합계가 1건 이상 발생.
