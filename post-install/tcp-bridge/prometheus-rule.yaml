apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tcp-bridge-alerts
  namespace: upm-app
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: tcp-bridge
spec:
  groups:
    - name: tcp-bridge.inbound
      rules:
        - alert: PGInboundErrorRatio
          expr: |
            (
              (tcp_bridge:inbound_error_ratio:2m >= 0.10)
              and
              (tcp_bridge:inbound_outcomes_total:increase2m >= 1)
            )
          for: 1m
          labels:
            severity: critical
            environment: MetricAlert
            service: "PGInboundErrorRatio"
            event: "{connection_name}"
            exported_instance: "{sys_id}"
          annotations:
            errCode: "3001"
            summary: "{{ $labels.connection_name }} inbound error ratio 심각"
            value: '{{ humanizePercentage $value }}'
            description: 최근 2분 동안 `{{ $labels.sys_id }}`의 `{{ $labels.connection_name }}` connection에서 완료된 inbound 요청 1건 이상 조건으로 error ratio `{{ humanizePercentage $value }}` 이상이 1분 이상 유지됨. 

    - name: tcp-bridge.outbound
      rules:
        - alert: PGOutboundErrorRatio
          expr: |
            (
              (tcp_bridge:outbound_error_ratio:2m >= 0.10)
              and
              (tcp_bridge:outbound_outcomes_total:increase2m >= 1)
            )
          for: 1m
          labels:
            severity: critical
            environment: MetricAlert
            service: "PGOutboundErrorRatio"
            event: "{connection_name}"
            exported_instance: "{sys_id}"
          annotations:
            errCode: "4001"
            summary: "{{ $labels.connection_name }} outbound error ratio 심각"
            description: 최근 2분 동안 `{{ $labels.sys_id }}`의 `{{ $labels.connection_name }}` connection에서 완료된 outbound 요청 1건 이상 조건으로 error ratio `{{ humanizePercentage $value }}` 이상이 1분 이상 유지됨. 
