apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cfg-distributor
  namespace: upm-ems
  labels:
    app.kubernetes.io/name: distributor
    app.kubernetes.io/instance: distributor
    release: kube-prometheus-stack   # Prometheus ServiceMonitorSelector 조건
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: distributor
      app.kubernetes.io/instance: distributor
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      metricRelabelings:
        - action: labeldrop
          regex: 'endpoint|instance|prometheus|job'
