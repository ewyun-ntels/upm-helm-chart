upmdb:
  auth:
    username: upmdb
    password: "upmdb"
  database: upmdb
  imageName: "ghcr.io/cloudnative-pg/postgis:18-3.6-system-trixie"
  pooler:
    service:
      type: NodePort
      nodePort: 30432
      # Example for internal-only access without NodePort:
      # type: ClusterIP
  storage:
    size: 5Gi
    storageClass: local-path

upmalert:
  enabled: true
  auth:
    username: upmalert
    password: "upmalert"
  database: upmalert
