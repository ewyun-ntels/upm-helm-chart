# Default values for tcp-bridge
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

# Instances configuration for multiple deployments
instances:
  - index: 0
    enabled: true
    ip: "10.255.254.101"
  - index: 1
    enabled: true
    ip: "10.255.254.102"

image:
  repository: 192.168.61.145/ewy/tcp-bridge
  pullPolicy: Always
  tag: "latest"

podAnnotations: {}

multus:
  enabled: true
  createNAD: true
  podAnnotations: {}
  network:
    name: "tcp-bridge-net"
    namespace: ""        # 빈값이면, Helm 설치 시 지정한 네임스페이스
    cniVersion: "0.3.1"
    type: "ipvlan"
    master: "eth0"
    mode: "l2"
    mtu: 0
    ipam:
      type: "static"
      gateway: "10.255.254.1"
      routes:
        - dst: "192.168.15.0/24"      # tcp endpoint 대역만 net1으로 라우팅
          gw: "10.255.254.1"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

initContainer:
  enabled: true
  name: setup-routing
  image:
    repository: ""
    tag: ""
    pullPolicy: ""
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    capabilities:
      add:
        - NET_ADMIN
    allowPrivilegeEscalation: true
  command:
    - /bin/sh
    - -c
    - |
      ETH0_IP=$(ip addr show eth0 | grep 'inet ' | awk '{print $2}' | cut -d/ -f1)
      ETH0_GW=$(ip route show default dev eth0 | awk '/default/ {print $3; exit}')
      if [ -z "$ETH0_IP" ] || [ -z "$ETH0_GW" ]; then
        echo "failed to detect eth0 ip or gateway"
        exit 1
      fi
      ip rule add from $ETH0_IP lookup 100
      ip route add default via $ETH0_GW dev eth0 table 100
      echo "policy routing set: from $ETH0_IP via eth0 gw $ETH0_GW (table 100)"

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

service:
  port: 8080

serviceMonitor:
  enabled: false
  labels:
    release: kube-prometheus-stack
  interval: 10s
  scrapeTimeout: 5s
  namespace: ""

prometheusRule:
  enabled: false

rollingUpdate:
  maxUnavailable: 1
  maxSurge: 0

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector:
  node-group.ntels.io/type: upm-app

# Node eviction settings
# Fast eviction when node becomes not-ready or unreachable
nodeEviction:
  enabled: true
  tolerationSeconds: 10

podAntiAffinity:
  enabled: true
  # Use 'required' for hard constraint or 'preferred' for soft constraint
  type: required  # required or preferred

formatterPgResponse:
  resultCode: "FA2004"

config:
  server:
    name: "tcp-bridge"
    version: "1.0.0"
    environment: "development"
    shutdown_timeout: "3s"

  tcp:
    endpoints:
      - name: "PG01"
        host: "192.168.10.112"
        port: 10506
        priority: 0
      - name: "PG-TEST"
        host: "10.255.254.22"
        port: 10506
        priority: 1
    
    connect_timeout: "2s"
    write_timeout: "30s"
    keep_alive: "30s"
    max_frame_size: 65535
    frame_header_size: 8
    handshake_timeout: "10s"
    ping_timeout: "5s"
    ping_interval_margin: "5s"

    sys_prefix_id: "upmc-"
    branch_name: "SS"

  nats:
    urls:
      - "nats://nats:4222"
    connect_timeout: "5s"

    message_type_routing:
      outbound:
        "09":
          subject: "tcp.cellinfo.noti"
          response_msg_type: "0a"
        "0b":
          subject: "tcp.subs.sync"
          response_msg_type: "0c"  
      inbound:
        "05":
          subject: "tcp.subs.chg"
          response_msg_type: "06"
        "07":
          subject: "tcp.subs.info"
          response_msg_type: "08"
        "0d":
          subject: "tcp.subs.dvc"
          response_msg_type: "0e"
        "0f":
          subject: "xxxxxxxxxxxxxxxxxxxx"
          response_msg_type: "10"

  message_handler:
    outbound:
      response_timeout: "5s"
      retry_attempts: 10
      worker_count: 20
      queue_size: 500
      error_reply:
        result_code: "FATB2004"
    inbound:
      timeout: "30s"
      worker_count: 20
      queue_size: 500

  pg_response_formatter:
    fle: "/app/formatter_pg_result.json"

  metrics:
    enabled: true
    port: 8080
    path: "/metrics"
    include_default_metrics: false

  logging:
    level: "debug"
    format: "text"

  alerta:
    enabled: true
    url: "http://alerta.upm-ems.svc.cluster.local:8080/api/alert"
    timeout: "3s"
    environment: "RealTimeAlert"
    alerts:
      - item: "PGConnectionState"
        group: "Connection"
        err_code: "1004"

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  successThreshold: 1
  failureThreshold: 3
