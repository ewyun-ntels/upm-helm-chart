# Default values for cfg-distributor
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: 192.168.61.145/ewy/cfg-distributor
  pullPolicy: Always
  tag: "latest"

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

service:
  type: ClusterIP
  port: 8080

config:
  log:
    level: "info"

  server:
    port: 8080

  nats:
    url: "nats://nats.upm-app.svc.cluster.local:4222"
    bucket: "UPM_CONFIG"

  watch:
    namespaces:
      - "cmp"
      - "default"
      - "kube-node-lease"
      - "kube-public"
      - "kube-system"
      - "upm-database"
      - "upm-loadbalancer"
      - "upm-loadbalancing"
      - "upm-logging"
      - "upm-messaging"
      - "upm-app"
      - "upm-ems"
    resources:
      - "configmaps"
      - "secrets"

  filter:
    managedLabel:
      key: "config.upm.io/managed"
      value: "true"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector:
  node-group.ntels.io/type: upm-ems

# Fast eviction when node becomes not-ready or unreachable
tolerations:
  - key: "node.kubernetes.io/not-ready"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 10
  - key: "node.kubernetes.io/unreachable"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 10

affinity: {}
