replicaCount: 2

deploymentStrategy:
  # edited by ewyun: use rolling update strategy for the Alerta deployment
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1

image:
  repository: alerta/alerta-web
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: NodePort
  port: 8080
  nodePort: 30880

containerPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: alerta.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Plain env vars (non-sensitive)
env:
  DEBUG: "false"
  # edited by ewyun: recycle pooled DB connections when using pgbouncer
  SQLALCHEMY_POOL_RECYCLE: "300"
  # Alerta 9.x reject plugin only accepts environments listed here.
  ALLOWED_ENVIRONMENTS: "Production,Development,RealTimeAlert,MetricAlert"
  # Used by webhook integrations when the incoming payload has no environment label.
  DEFAULT_ENVIRONMENT: "RealTimeAlert"
  # Disable alert expiration while keeping closed/expired and informational alerts for one year.
  ALERT_TIMEOUT: "0"
  DELETE_EXPIRED_AFTER: "31536000"
  DELETE_INFO_AFTER: "31536000"
  HK_EXPIRED_DELETE_HRS: "0"
  HK_INFO_DELETE_HRS: "0"
  DEFAULT_EXPIRED_DELETE_HRS: "0"
  DEFAULT_INFO_DELETE_HRS: "0"

# Existing secret name to import as envFrom (optional)
envFromSecretName: ""

# Create a secret from this chart and import as envFrom
secret:
  create: true
  name: ""
  stringData:
    # edited by ewyun: connect Alerta to the existing PostgreSQL cluster through pgbouncer
    DATABASE_URL: postgresql://upmalert:upmalert@upmdb-pooler.upm-app.svc.cluster.local:5432/upmalert
    SECRET_KEY: change-me-very-long-random-string
    ADMIN_KEY: change-me-admin-key
  # Example:
  # stringData:
  #   DATABASE_URL: postgresql://alerta:alerta@postgres:5432/monitoring
  #   SECRET_KEY: change-me
  #   ADMIN_KEY: change-me

volumes: []
volumeMounts: []

nodeSelector:
  # edited by ewyun: pin Alerta pods to EMS nodes
  node-group.ntels.io/type: upm-ems
tolerations:
  # edited by ewyun: fast node eviction for Alerta pods when node becomes not-ready or unreachable
  - key: "node.kubernetes.io/not-ready"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 10
  - key: "node.kubernetes.io/unreachable"
    operator: "Exists"
    effect: "NoExecute"
    tolerationSeconds: 10
affinity: {}

podAntiAffinity:
  enabled: true
  # edited by ewyun: require Alerta replicas to be placed on different nodes
  # Set to "required" to enforce scheduling on different nodes.
  # "preferred" is safer for small clusters.
  type: required
  topologyKey: kubernetes.io/hostname
